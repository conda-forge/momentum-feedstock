bot:
  automerge: true
conda_build:
  error_overlinking: true
conda_build_tool: rattler-build
conda_forge_output_validation: true
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  osx_arm64: default
test: native_and_emulated
workflow_settings:
  build_workspace_dir:
    - os: win
      provider: azure
      value: C:\\bld\\
  free_disk_space: max
  tools_install_dir:
    - os: win
      provider: azure
      value: C:\Miniforge
