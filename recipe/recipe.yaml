schema_version: 1

context:
  name: momentum
  version: "0.1.115"
  build_number: 2

recipe:
  name: ${{ name|lower }}-split
  version: ${{ version }}

source:
  - url: https://github.com/facebookresearch/momentum/archive/v${{ version }}.tar.gz
    sha256: 77aa49967c9fb793dc2b9be0a749fa2584d721e0d06e11712e97d50c3f7c65a6

build:
  number: ${{ build_number }}

outputs:
  - package:
      name: momentum-cpp
    build:
      skip:
        - cuda_compiler_version != "None"
      script:
        file: ${{ "bld_cpp.bat" if win else "build_cpp.sh" }}
    requirements:
      build:
        - ${{ compiler("cxx") }}
        - ${{ stdlib("c") }}
        - cmake
        - ninja
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
      host:
        - ceres-solver * cpu*
        - cli11
        - dispenso
        - drjit-cpp * cpu*
        # Momentum 0.1.111 requires Eigen 5.0.x.
        - eigen >=5.0,<5.1
        - ezc3d
        - fmt
        - fx-gltf
        - indicators
        - librerun-sdk
        - mdspan >=0.6.1.dev20260223
        - ms-gsl
        - nlohmann_json
        - openfbx
        - if: linux
          then:
            - openusd
            - python
        - re2
        - spdlog
        # OpenUSD 26.08 still uses the legacy tbb::task API removed in TBB 2023.1.
        - if: not win
          then: tbb-devel <2023.1
        - urdfdom
      run:
        - ceres-solver * cpu*
        - cli11
        - dispenso
        - drjit-cpp * cpu*
        # The installed CMake config requires Eigen 5.0.x.
        - eigen >=5.0,<5.1
        - ezc3d
        - fx-gltf
        - indicators
        - if: osx
          then: libabseil
        - librerun-sdk
        - mdspan >=0.6.1.dev20260223
        - gflags
        - libdeflate
        - ms-gsl
        - nlohmann_json
        - openfbx
        - if: linux
          then: python
        - re2
        - if: linux
          then: tbb
      run_exports:
        - ${{ pin_subpackage("momentum-cpp", upper_bound="x.x") }}
      ignore_run_exports:
        from_package:
          - ceres-solver
          - drjit-cpp
          - gflags
          - openfbx
          - re2
          - tbb-devel  # Allow solver to pick tbb version compatible with libtorch/mkl
    tests:
      - files:
          recipe:
            - run_test_cpp.bat
            - run_test_cpp.sh
            - tests/
        requirements:
          run:
            - ${{ compiler("c") }}
            - ${{ compiler("cxx") }}
            - ${{ stdlib("c") }}
            - cmake
            - ninja
        script:
          - if: not win
            then:
              - test -f "${PREFIX}/lib/cmake/momentum/momentum-config.cmake"
              - bash run_test_cpp.sh
            else:
              - if not exist "%PREFIX%\\Library\\lib\\cmake\\momentum\\momentum-config.cmake" exit 1
              - call run_test_cpp.bat
          - animate_shapes --help
          - c3d_viewer --help
          - convert_model --help
          - fbx_viewer --help
          - glb_viewer --help
          - hello_world
          - process_markers_app --help
          - refine_motion --help
          - urdf_viewer --help

  # CPU only: compile pymomentum once per Python, with the torch extensions, into
  # the pymomentum-cpu wheel; the pymomentum-core wheel is that wheel without the
  # pymomentum_torch CMake install component (build_py.sh / bld_py.bat).
  - staging:
      name: pymomentum-build
    requirements:
      build:
        - if: cuda_compiler_version == "None"
          then:
            - ${{ compiler("cxx") }}
            - ${{ stdlib("c") }}
            - cmake
            - if: build_platform != target_platform
              then: cross-python_${{ target_platform }}
            - ninja
            - pip
            - pybind11-abi ==11
            - python
            - pytorch * cpu*
            - scikit-build-core >=0.11
      host:
        - if: cuda_compiler_version == "None"
          then:
            - ceres-solver * cpu*
            - cli11
            - dispenso
            - drjit-cpp * cpu*
            # Momentum 0.1.111 requires Eigen 5.0.x.
            - eigen >=5.0,<5.1
            - ezc3d
            - fmt
            - fx-gltf
            - indicators
            - mdspan >=0.6.1.dev20260223
            - librerun-sdk
            - ms-gsl
            - nlohmann_json
            - numpy
            - openfbx
            - if: linux
              then: openusd
            - pip
            - pytest
            - pybind11
            - python
            - pytorch * cpu*
            - if: unix
              then: libtorch * cpu* # Provides torch/torch.h C++ headers
            - re2
            - scikit-build-core >=0.11
            - spdlog
            - if: not win
              then: tbb-devel <2023.1
            - urdfdom
            - zlib
    build:
      script:
        env:
          # Staging builds do not set PKG_VERSION; prepare_pyproject.py needs it.
          PKG_VERSION: ${{ version }}
        content:
          - if: cuda_compiler_version == "None" and win
            then: call "%RECIPE_DIR%\bld_py.bat"
          - if: cuda_compiler_version == "None" and not win
            then: bash "${RECIPE_DIR}/build_py.sh"

  - package:
      name: pymomentum-core
    inherit:
      from: pymomentum-build
      run_exports: false
    build:
      skip:
        - cuda_compiler_version != "None"
      string: ${{ "core_py" ~ (python | version_to_buildstring) ~ "_h" ~ hash ~ "_" ~ build_number }}
      script:
        file: ${{ "install_py.bat" if win else "install_py.sh" }}
      # The staging prefix also holds files made by host dependencies (e.g.
      # post-link scripts) and by build_py.sh; package only pymomentum.
      files:
        - "**/site-packages/pymomentum/**"
        - "**/site-packages/pymomentum_*.dist-info/**"
      # Internal DLLs bundled together that reference each other
      dynamic_linking:
        missing_dso_allowlist:
          - if: win
            then:
              - "*/momentum_*.dll"
              - "*/axel.dll"
    requirements:
      build:
        - ${{ compiler("cxx") }}
        - ${{ stdlib("c") }}
        - cmake
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - ninja
        - pip
        - pybind11-abi ==11
        - python
        - scikit-build-core >=0.11
      host:
        - ceres-solver * cpu*
        - cli11
        - dispenso
        - drjit-cpp * cpu*
        # Momentum 0.1.111 requires Eigen 5.0.x.
        - eigen >=5.0,<5.1
        - ezc3d
        - fmt
        - fx-gltf
        - indicators
        - mdspan >=0.6.1.dev20260223
        - librerun-sdk
        - ms-gsl
        - nlohmann_json
        - numpy
        - openfbx
        - if: linux
          then: openusd
        - pip
        - pytest
        - pybind11
        - python
        - re2
        - scikit-build-core >=0.11
        - spdlog
        - if: not win
          then: tbb-devel <2023.1
        - urdfdom
        - zlib
      run:
        - ezc3d
        - dispenso
        - if: win
          then:
            - drjit-cpp * cpu*
            - fmt
        - gflags
        - indicators
        - if: osx
          then: libabseil
        - libdeflate
        - if: win
          then: librerun-sdk
        # Direct DSOs used by the Python extensions; host run exports do not
        # cover all of these in the CUDA build.
        - if: linux
          then:
            - libgcc
            - libstdcxx
        - if: linux or win
          then: libre2-11
        - numpy
        - python ${{ python }}
        - python_abi * *_cp${{ python | version_to_buildstring }}
        - pytorch >=1.13
        - scipy >=1.7
        - spdlog
        - if: linux
          then: tbb
        - urdfdom
        - if: win
          then:
            - ucrt
            - vc14_runtime
      run_constraints:
        - pymomentum <0a0
        - pymomentum-cpu <0a0
        - pymomentum-gpu <0a0
    tests:
      - requirements:
          run:
            - pip
        script:
          - python -c "import pymomentum.axel"
          - python -c "import pymomentum.backend"
          - python -c "import pymomentum.geometry"
          - python -c "import pymomentum.marker_tracking"
          - python -c "import pymomentum.quaternion"
          - python -c "import pymomentum.renderer"
          - python -c "import pymomentum.skel_state"
          - python -c "import pymomentum.solver2"
          - python -c "import torch; import pymomentum.torch.character"
          - python -c "import pymomentum.trs"
          - python -c "import importlib.util; assert importlib.util.find_spec('pymomentum.diff_geometry') is None"
          - python -c "import importlib.util; assert importlib.util.find_spec('pymomentum.solver') is None"
          - python -c "from importlib.metadata import version; assert version('pymomentum-core') == '${{ version }}'"
          - pip check

  - package:
      name: ${{ "pymomentum-gpu" if cuda_compiler_version != "None" else "pymomentum-cpu" }}
    # CUDA builds here; the staging output is empty for CUDA.
    inherit:
      from: pymomentum-build
      run_exports: false
    build:
      string: ${{ "cuda" ~ (cuda_compiler_version | replace(".", "")) ~ "_py" ~ (python | version_to_buildstring) ~ "_pt" ~ (pytorch | replace(".", "")) ~ "_h" ~ hash ~ "_" ~ build_number if cuda_compiler_version != "None" else "cpu_py" ~ (python | version_to_buildstring) ~ "_pt" ~ (pytorch | replace(".", "")) ~ "_h" ~
        hash ~ "_" ~ build_number }}
      script:
        file: ${{ ("bld_py.bat" if win else "build_py.sh") if cuda_compiler_version != "None" else ("install_py.bat" if win else "install_py.sh") }}
        env:
          MOMENTUM_BUILD_TORCH_EXTENSIONS: "ON"
      # See pymomentum-core; the staging output is empty for CUDA.
      files:
        include:
          - if: cuda_compiler_version == "None"
            then:
              - "**/site-packages/pymomentum/**"
              - "**/site-packages/pymomentum_*.dist-info/**"
            else: "**"
      # Internal DLLs bundled together that reference each other
      dynamic_linking:
        missing_dso_allowlist:
          - if: win
            then:
              - "*/momentum_*.dll"
              - "*/axel.dll"
              - if: cuda_compiler_version != "None"
                then: "*/nvcuda.dll"
    requirements:
      build:
        - ${{ compiler("cxx") }}
        - ${{ stdlib("c") }}
        - if: cuda_compiler_version != "None" and not win
          then:
            - ${{ compiler("cuda") }}
        - if: cuda_compiler_version != "None" and win
          then:
            - cuda-version ==${{ cuda_compiler_version }}
            - vs2022_win-64
            - cuda-nvcc_win-64
        - cmake
        - if: build_platform != target_platform
          then: cross-python_${{ target_platform }}
        - ninja
        - pip
        - pybind11-abi ==11
        - python
        - if: cuda_compiler_version == "None"
          then: pytorch * cpu*
          else: pytorch
        - scikit-build-core >=0.11
      host:
        # GPU requirements
        - if: cuda_compiler_version != "None"
          then:
            - if: not win
              then: cuda-libraries-dev
            - cuda-version ==${{ cuda_compiler_version }}
            - if: win
              then:
        # CUDA runtime/headers for both link & import time:
                - vs2022_win-64
                - cuda-cudart-dev
            - cuda-cudart
            - if: win
              then: cuda-nvrtc-dev
            - cuda-nvrtc
            - nvtx-c
            - ceres-solver
          else: ceres-solver * cpu*
        - cli11
        - dispenso
        - if: cuda_compiler_version == "None"
          then: drjit-cpp * cpu*
          else: drjit-cpp
        # Momentum 0.1.111 requires Eigen 5.0.x.
        - eigen >=5.0,<5.1
        - ezc3d
        - fmt
        - fx-gltf
        - indicators
        - mdspan >=0.6.1.dev20260223
        - librerun-sdk
        - ms-gsl
        - nlohmann_json
        - numpy
        - openfbx
        - if: linux
          then: openusd
        - pip
        - pytest
        - pybind11
        - python
        - if: cuda_compiler_version == "None"
          then:
            - pytorch * cpu*
            - if: unix
              then: libtorch * cpu* # Provides torch/torch.h C++ headers
          else: pytorch
        - if: unix and cuda_compiler_version != "None"
          then: libtorch  # Provides torch/torch.h C++ headers
        - re2
        - scikit-build-core >=0.11
        - spdlog
        - if: not win
          then: tbb-devel <2023.1
        - urdfdom
        - zlib
      run:
        # CUDA runtime needed at import time (no GPU required to import):
        - if: cuda_compiler_version != "None"
          then:
            - cuda-cudart
            - cuda-nvrtc
        - ezc3d
        - dispenso
        - if: win
          then:
            - if: cuda_compiler_version == "None"
              then: drjit-cpp * cpu*
              else: drjit-cpp
            - fmt
        - gflags
        - indicators
        - if: osx
          then: libabseil
        - libdeflate
        - if: win
          then: librerun-sdk
        # Direct DSOs used by the Python extensions; host run exports do not
        # cover all of these in the CUDA build.
        - if: linux
          then:
            - libgcc
            - libstdcxx
        - if: linux or win
          then: libre2-11
        - if: unix and cuda_compiler_version == "None"
          then: libtorch * cpu*
        - if: unix and cuda_compiler_version != "None"
          then: libtorch * cuda*
        - if: win and cuda_compiler_version == "None"
          then: libtorch * cpu*
        - if: win and cuda_compiler_version != "None"
          then: libtorch
        - pytorch
        - numpy
        - python ${{ python }}
        - python_abi * *_cp${{ python | version_to_buildstring }}
        - scipy >=1.7
        - spdlog
        - if: linux
          then: tbb
        - urdfdom
        - if: win
          then:
            - ucrt
            - vc14_runtime
      run_constraints:
        - pymomentum-core <0a0
        - if: cuda_compiler_version != "None"
          then: pymomentum-cpu <0a0
          else: pymomentum-gpu <0a0
    tests:
      - requirements:
          run:
            - pip
        script:
          - python -c "import pymomentum.axel"
          - if: not (win and cuda_compiler_version != "None")
            then:
              - python -c "import pymomentum.backend"
              - python -c "import pymomentum.geometry"
              - python -c "import pymomentum.diff_geometry"
              - python -c "import pymomentum.marker_tracking"
          - python -c "import pymomentum.quaternion"
          - if: cuda_compiler_version == "None"
            then: python -c "import pymomentum.renderer"
          - python -c "import pymomentum.skel_state"
          - if: not (win and cuda_compiler_version != "None")
            then:
              - python -c "import pymomentum.solver"
              - python -c "import pymomentum.solver2"
              - python -c "import pymomentum.torch.character"
          - python -c "import pymomentum.trs"
          - if: cuda_compiler_version != "None"
            then: python -c "from importlib.metadata import version; assert version('pymomentum-gpu') == '${{ version }}'"
            else: python -c "from importlib.metadata import version; assert version('pymomentum-cpu') == '${{ version }}'"
          - pip check

  - package:
      name: pymomentum
    build:
      string: ${{ "cuda" ~ (cuda_compiler_version | replace(".", "")) ~ "_py" ~ (python | version_to_buildstring) ~ "_pt" ~ (pytorch | replace(".", "")) ~ "_h" ~ hash ~ "_" ~ build_number if cuda_compiler_version != "None" else "cpu_py" ~ (python | version_to_buildstring) ~ "_pt" ~ (pytorch | replace(".", "")) ~ "_h" ~
        hash ~ "_" ~ build_number }}
    requirements:
      run:
        - if: cuda_compiler_version != "None"
          then: ${{ pin_subpackage("pymomentum-gpu", exact=True) }}
          else: ${{ pin_subpackage("pymomentum-cpu", exact=True) }}
    tests:
      - requirements:
          run:
            - pip
        script:
          - python -c "import pymomentum.axel"
          - if: cuda_compiler_version != "None"
            then: python -c "from importlib.metadata import version; assert version('pymomentum-gpu') == '${{ version }}'"
            else: python -c "from importlib.metadata import version; assert version('pymomentum-cpu') == '${{ version }}'"
          - pip check

  - package:
      name: momentum
    build:
      # The aggregate package includes the C++ library, which is CPU-only.
      skip:
        - cuda_compiler_version != "None"
    requirements:
      run:
        - ${{ pin_subpackage("momentum-cpp", exact=True) }}
        - ${{ pin_subpackage("pymomentum-cpu", exact=True) }}
        - python
      run_exports:
        - ${{ pin_subpackage("momentum-cpp", upper_bound="x.x") }}
    tests:
      - requirements:
          run:
            - pip
        script:
          - python -c "import pymomentum.axel"
          - hello_world
          - python -c "from importlib.metadata import version; assert version('pymomentum-cpu') == '${{ version }}'"
          - pip check

about:
  homepage: https://facebookresearch.github.io/momentum/
  summary: A library for human kinematic motion and numerical optimization solvers to apply human motion
  description: |
    A library for human kinematic motion and numerical optimization solvers to apply human motion
  license: MIT
  license_file: LICENSE
  repository: https://github.com/facebookresearch/momentum
  documentation: https://facebookresearch.github.io/momentum/

extra:
  feedstock-name: momentum
  recipe-maintainers:
    - jeongseok-meta
